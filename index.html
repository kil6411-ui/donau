<!doctype html>

<title>돈암1동 복지지도</title>

<style>
:root{
  --ink:#1B2A22; --pine:#2E6B4E; --pine-dark:#204C38;
  --mist:#EEF4EF; --paper:#FFFFFF; --persimmon:#B8541F;
  --stone:#77837C; --line:#DCE3DD; --step:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  font-size:calc(16.5px + var(--step)); line-height:1.62; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:440px;margin:0 auto;padding:0 20px 56px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--persimmon);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}

/* ── 머리 ── */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:34px 0 0}
.mark{font-family:"Gowun Batang",serif;font-weight:700;font-size:calc(33px + var(--step));
  line-height:1.16;letter-spacing:-.02em;margin:0}
.mark span{display:block;color:var(--pine)}
.zoom{flex:0 0 auto;margin-top:6px;color:var(--stone);font-size:calc(14px + var(--step));
  border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#fff;line-height:1.2}
.zoom b{color:var(--pine);font-weight:700}
.lede{margin:16px 0 0;color:var(--stone);font-size:calc(15.5px + var(--step))}

/* ── 유일한 강조: 가장 먼저 걸 번호 ── */
.first{margin-top:22px;border-radius:16px;background:var(--pine);color:#fff;padding:20px}
.first p{margin:0;font-size:calc(15px + var(--step));color:rgba(255,255,255,.82)}
.first strong{display:block;font-size:calc(19px + var(--step));margin:2px 0 15px}
.first .call{background:#fff;color:var(--pine);border:none}
.first .call:active{background:var(--mist)}
.first .note{margin:13px 0 0;font-size:calc(14px + var(--step));color:rgba(255,255,255,.72)}

/* ── 버튼 ── */
.call,.way{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;
  padding:0 16px;border-radius:11px;text-decoration:none;font-weight:700;
  font-size:calc(17px + var(--step))}
.call{background:var(--pine);color:#fff;border:none;width:100%}
.call:active{background:var(--pine-dark)}
.way{background:#fff;color:var(--pine);border:1.5px solid var(--pine);width:100%}
.way:active{background:var(--mist)}
.pair{display:flex;gap:9px;margin-top:15px}
.pair .call,.pair .way{width:50%}

.first .closed{margin-top:15px;padding:14px;border-radius:11px;
  background:rgba(255,255,255,.14);font-size:calc(14.5px + var(--step));line-height:1.5}
.first .closed b{color:#fff}
.first .closed .way{margin-top:11px;background:transparent;color:#fff;
  border-color:rgba(255,255,255,.6);min-height:48px}

/* ── 두 번째 연락처 (조용하게) ── */
.second{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:9px;padding:15px 18px;border:1px solid var(--line);border-radius:13px;
  background:#fff;text-decoration:none;min-height:54px}
.second span{font-size:calc(14px + var(--step));color:var(--stone);line-height:1.4}
.second b{display:block;color:var(--ink);font-size:calc(16px + var(--step))}
.second .num{flex:0 0 auto;color:var(--pine);font-weight:700;font-size:calc(15.5px + var(--step))}

/* ── 상황 타일 ── */
.ask{margin:30px 0 12px;font-size:calc(17px + var(--step));font-weight:700;color:var(--stone)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{display:flex;flex-direction:column;justify-content:flex-end;min-height:106px;padding:15px;
  text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;
  font-size:calc(16.5px + var(--step));font-weight:700;line-height:1.34}
.tile:active{background:var(--mist)}
.tile:last-child:nth-child(odd){grid-column:1 / -1;min-height:78px}
.tile em{display:block;font-style:normal;font-weight:400;color:var(--stone);
  font-size:calc(13.5px + var(--step));margin-top:3px}
.tile svg{width:28px;height:28px;margin-bottom:auto;stroke:var(--pine);stroke-width:1.7;
  fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── 조용한 보조 링크 줄 ── */
.morerow{margin-top:20px;border-top:1px solid var(--line)}
.morerow button{display:flex;align-items:center;justify-content:space-between;width:100%;
  min-height:54px;color:var(--pine);font-weight:700;font-size:calc(16px + var(--step));
  border-bottom:1px solid var(--line);text-align:left}
.morerow button::after{content:"›";color:var(--stone);font-size:20px;font-weight:400}

/* ── 홈 화면에 담기 (조용하게) ── */
.install{margin-top:26px;color:var(--stone)}
.install h2{margin:0 0 4px;font-size:calc(15.5px + var(--step));color:var(--ink)}
.install p{margin:0;font-size:calc(14px + var(--step))}
.install button{margin-top:12px;min-height:48px;padding:0 20px;border-radius:10px;
  border:1.5px solid var(--pine);color:var(--pine);font-weight:700;font-size:calc(15.5px + var(--step))}
.install .steps{margin:9px 0 0;padding-left:18px;font-size:calc(14px + var(--step))}
.install .steps li{margin-top:3px}

/* ── 목록 화면 ── */
.back{display:inline-flex;align-items:center;gap:6px;margin:26px 0 6px;min-height:44px;
  color:var(--pine);font-weight:700;font-size:calc(15.5px + var(--step))}
.head{font-family:"Gowun Batang",serif;font-size:calc(26px + var(--step));font-weight:700;margin:0}
.head-sub{color:var(--stone);margin:4px 0 18px;font-size:calc(14.5px + var(--step))}

.kinds{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px}
.kinds li{display:flex;align-items:center;gap:7px;font-size:calc(14px + var(--step));color:var(--stone)}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px}

/* ── 지도 ── */
.mapbox{position:relative;height:250px;border-radius:13px;overflow:hidden;
  margin-bottom:9px;background:var(--mist)}
.mapbox.tall{height:58vh;min-height:330px}
#map{width:100%;height:100%}
.maphint{margin:0 0 20px;color:var(--stone);font-size:calc(13.5px + var(--step))}
.mapoff{display:flex;align-items:center;justify-content:center;height:100%;padding:22px;
  text-align:center;color:var(--stone);font-size:calc(14.5px + var(--step))}
.pin{transform:translate(-50%,-100%);background:var(--pine);color:#fff;font-weight:700;
  font-size:12.5px;line-height:1;padding:7px 11px;border-radius:8px;white-space:nowrap;
  box-shadow:0 2px 7px rgba(0,0,0,.24)}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-top:6px solid;border-top-color:inherit}
.pin.on{outline:2.5px solid var(--ink);outline-offset:2px}

/* ── 자원 카드 ── */
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--stone);
  border-radius:13px;padding:18px;margin-bottom:10px;scroll-margin-top:14px}
.card.on{border-color:var(--persimmon)}
.card .shot{display:block;width:100%;height:146px;object-fit:cover;border-radius:9px;
  margin:0 0 13px;background:var(--mist)}
.card h3{margin:0;font-size:calc(19px + var(--step));line-height:1.34}
.card .what{margin:6px 0 0;font-size:calc(15.5px + var(--step))}
.meta{margin:13px 0 0;padding:0;list-style:none;color:var(--stone);font-size:calc(14.5px + var(--step))}
.meta li{display:flex;gap:9px;margin-top:3px}
.meta li b{flex:0 0 40px;font-weight:400;color:var(--stone)}
.meta li span{color:var(--ink)}
.todo{display:inline-block;margin-top:12px;padding:3px 9px;border-radius:5px;
  background:#FBEEE5;color:var(--persimmon);font-size:calc(13.5px + var(--step));font-weight:700}
.empty{padding:22px;border:1px dashed var(--line);border-radius:13px;color:var(--stone)}

/* ── 손그림 지도 ── */
.poster{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:auto;
  -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;margin-bottom:10px}
.poster img{display:block;width:100%;height:auto}
.poster.zoom img{width:260%;max-width:none}
.postercap{margin:14px 0 0;color:var(--stone);font-size:calc(14.5px + var(--step))}
.legend{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px}
.legend li{display:flex;align-items:center;gap:7px;color:var(--stone);font-size:calc(14px + var(--step))}
.pzoom{margin-top:2px;min-height:48px;padding:0 18px;border-radius:10px;
  border:1.5px solid var(--pine);color:var(--pine);font-weight:700;font-size:calc(15.5px + var(--step))}

/* ── 주민 이야기 남기기 ── */
.voice{margin-top:22px;padding:20px;border-radius:16px;background:var(--mist)}
.voice h2{margin:0 0 5px;font-size:calc(18px + var(--step))}
.voice p{margin:0 0 15px;color:var(--stone);font-size:calc(14.5px + var(--step))}
.voice button{width:100%;min-height:52px;border-radius:11px;background:#fff;
  border:1.5px solid var(--pine);color:var(--pine);font-weight:700;font-size:calc(16.5px + var(--step))}
.voice button:active{background:#fff;opacity:.7}

.field{margin-bottom:22px}
.field > label{display:block;font-weight:700;font-size:calc(17px + var(--step));margin-bottom:4px}
.field .hint{display:block;color:var(--stone);font-size:calc(14px + var(--step));margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:14px;background:#fff;
  border:1px solid var(--line);border-radius:11px;cursor:pointer;font-size:calc(16px + var(--step))}
.opt input{margin:3px 0 0;width:20px;height:20px;accent-color:var(--pine);flex:0 0 20px}
.opt.sel{border-color:var(--pine);background:var(--mist)}
.opt em{display:block;font-style:normal;font-weight:400;color:var(--stone);font-size:calc(13.5px + var(--step))}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;
  font-size:calc(15.5px + var(--step));min-height:44px}
.chip.sel{border-color:var(--pine);background:var(--pine);color:#fff;font-weight:700}
textarea,input[type=text]{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;
  background:#fff;font:inherit;color:var(--ink);resize:vertical}
textarea{min-height:130px}
.privacy{padding:15px;border-radius:11px;background:#fff;border:1px solid var(--line);
  color:var(--stone);font-size:calc(13.5px + var(--step));margin-bottom:14px}
.privacy ul{margin:7px 0 0;padding-left:17px}
.agree{display:flex;align-items:flex-start;gap:11px;font-size:calc(15.5px + var(--step));
  margin-bottom:20px;cursor:pointer}
.agree input{margin:3px 0 0;width:20px;height:20px;accent-color:var(--pine);flex:0 0 20px}
.urgent{padding:17px;border-radius:12px;background:var(--pine);color:#fff;margin-bottom:22px}
.urgent p{margin:0 0 12px;font-size:calc(15.5px + var(--step))}
.urgent .call{background:#fff;color:var(--pine)}
.thanks{padding:30px 22px;text-align:center;background:var(--mist);border-radius:16px}
.thanks h2{font-family:"Gowun Batang",serif;font-size:calc(24px + var(--step));margin:0 0 10px}
.thanks p{margin:0 0 6px;color:var(--stone);font-size:calc(15.5px + var(--step))}
.err{color:var(--persimmon);font-weight:700;margin:0 0 14px;font-size:calc(15px + var(--step))}

/* ── 꼬리 ── */
.foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--stone);font-size:calc(13.5px + var(--step))}
.foot p{margin:0 0 5px}

@media (prefers-reduced-motion:no-preference){
  .view{animation:in .2s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
</style>
</head>

         ※ geojson.io는 [경도, 위도] 순서라 뒤집어야 합니다
      비워두면 경계선 없이 지도만 나옵니다.

const BOUNDARY = [
  // {lat:37.6050, lng:127.0190},

/* =======================================================================
   0-2) 손으로 만든 동네지도 이미지

      ※ 반드시 '주민 공개용'으로 다시 만든 이미지를 쓰세요.

   ======================================================================= */
const POSTER = {

   1) 상황 분류 — 주민이 쓰는 말로

      응답은 구글 스프레드시트에 자동으로 쌓입니다. (설정법은 README)

      id     : 폼 주소 .../d/e/여기부분/viewform

const ISSUE_FORM = {

/* 주민이 고를 수 있는 이야기 종류 */
const ISSUE_TYPES = [
  {id:"broken", label:"불편하거나 고장 난 곳", hint:"계단, 가로등, 손잡이, 길 등"},

/* 아이콘 — 이모지는 기기마다 모양이 달라 직접 그린 선 아이콘을 씁니다 */
const ICONS = {

let kakaoReady = null;
function loadKakao(){
  if (kakaoReady) return kakaoReady;
  kakaoReady = new Promise(resolve=>{
    if (!KAKAO_KEY) return resolve(false);
    const s = document.createElement("script");
    s.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey="+KAKAO_KEY+"&libraries=services&autoload=false";
    s.onload = ()=> kakao.maps.load(()=>resolve(true));
    s.onerror = ()=> resolve(false);
    document.head.appendChild(s);
  });
  return kakaoReady;
}

const geoCache = {};
function geocode(addr){
  return new Promise(resolve=>{
    if (geoCache[addr] !== undefined) return resolve(geoCache[addr]);
    new kakao.maps.services.Geocoder().addressSearch(addr,(res,status)=>{
      const ok = status === kakao.maps.services.Status.OK && res.length;
      const p = ok ? {lat:+res[0].y, lng:+res[0].x} : null;
      geoCache[addr] = p;
      resolve(p);
    });
  });
}

/* ── 지도 그리기 ─────────────────────────────────────── */
async function drawMap(items, tall){
  const box = document.getElementById("mapbox");
  if (!box) return;
  const ok = await loadKakao();
  if (!ok){
    box.innerHTML = `<div class="mapoff">지도를 준비 중입니다.<br>아래 목록의 <b>길찾기</b>를 눌러 주세요.</div>`;
    return;
  }
  const map = new kakao.maps.Map(box.querySelector("#map"), {
    center:new kakao.maps.LatLng(CENTER.lat, CENTER.lng), level:5
  });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

  /* 주민들이 그린 동 경계를 그대로 얹습니다 */
  let outline = null;
  if (BOUNDARY.length > 2) {
    const path = BOUNDARY.map(p => new kakao.maps.LatLng(p.lat, p.lng));
    outline = new kakao.maps.Polygon({
      map, path,
      strokeWeight:2, strokeColor:"#4A87B8", strokeOpacity:.9, strokeStyle:"solid",
      fillColor:"#8FC0E4", fillOpacity:.22
    });
  }

  const bounds = new kakao.maps.LatLngBounds();
  if (BOUNDARY.length > 2) BOUNDARY.forEach(p => bounds.extend(new kakao.maps.LatLng(p.lat, p.lng)));
  let found = 0;
  const pins = [];

  for (const r of items){
    let p = (r.lat && r.lng) ? {lat:r.lat, lng:r.lng} : (r.addr ? await geocode(r.addr) : null);
    if (!p) continue;
    found++;
    const pos = new kakao.maps.LatLng(p.lat, p.lng);
    bounds.extend(pos);

    const el = document.createElement("div");
    el.className = "pin";
    el.style.background = kindOf(r).color;
    el.style.borderTopColor = kindOf(r).color;
    el.textContent = shortName(r);
    el.setAttribute("role","button");
    el.tabIndex = 0;
    const focus = ()=>{
      pins.forEach(x=>x.classList.remove("on"));
      el.classList.add("on");
      const card = document.getElementById("card-"+r._i);
      if (card){
        document.querySelectorAll(".card").forEach(c=>c.classList.remove("on"));
        card.classList.add("on");
        card.scrollIntoView({behavior:"smooth", block:"center"});
      }
    };
    el.onclick = focus;
    el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); focus(); } };
    pins.push(el);

    new kakao.maps.CustomOverlay({map, position:pos, content:el, yAnchor:1, clickable:true});
  }

  if (found === 0 && BOUNDARY.length < 3){
    box.innerHTML = `<div class="mapoff">아직 지도에 표시할 주소가 없습니다.<br>자원 정보에 주소를 넣으면 자동으로 나타납니다.</div>`;
    return;
  }
  if (found === 1) map.setCenter(bounds.getSouthWest());
  else map.setBounds(bounds, 40, 40, 40, 40);
  if (tall) setTimeout(()=>map.relayout(), 60);
}

      <li><span class="dot" style="background:#E8B32A"></span>경로당</li>
    </ul>

    <div class="poster" id="poster"><img src="${esc(POSTER.src)}" alt="주민들과 함께 만든 돈암1동 동네지도"></div>
    <button class="pzoom" id="pzoom">지도 크게 보기</button>
    <p class="postercap" style="margin-top:14px">${esc(POSTER.caption)}</p>
  `);
  document.getElementById("back").onclick = home;
  const box = document.getElementById("poster");
  const btn = document.getElementById("pzoom");
  btn.onclick = ()=>{
    box.classList.toggle("zoom");
    btn.textContent = box.classList.contains("zoom") ? "지도 줄이기" : "지도 크게 보기";
    if (box.classList.contains("zoom")) box.scrollLeft = box.scrollWidth/2 - box.clientWidth/2;
  };
  window.scrollTo(0,0);
}

/* ── 화면: 목록 + 지도 ───────────────────────────────── */
function card(r){
  const rows = [
    r.addr && `<li><b>주소</b><span>${esc(r.addr)}</span></li>`,
    r.when && `<li><b>시간</b><span>${esc(r.when)}</span></li>`,
    r.who  && `<li><b>대상</b><span>${esc(r.who)}</span></li>`,
  ].filter(Boolean).join("");

  let actions = "";
  if (r.tel && r.addr) actions = `<div class="pair">
      <a class="call" href="${telHref(r.tel)}">전화하기</a>
      <a class="way" href="${mapHref(r.addr)}" target="_blank" rel="noopener">길찾기</a></div>`;
  else if (r.tel) actions = `<div class="pair"><a class="call" href="${telHref(r.tel)}">전화하기 ${esc(r.tel)}</a></div>`;
  else if (r.addr) actions = `<div class="pair"><a class="way" href="${mapHref(r.addr)}" target="_blank" rel="noopener">길찾기</a></div>`;

  return `<article class="card" id="card-${r._i}" style="border-left-color:${kindOf(r).color}">
    ${r.photo ? `<img class="shot" src="${esc(r.photo)}" alt="${esc(r.name)} 모습" loading="lazy">` : ""}
    <h3>${esc(r.name)}</h3>
    ${r.what ? `<p class="what">${esc(r.what)}</p>` : ""}
    ${rows ? `<ul class="meta">${rows}</ul>` : ""}
    ${r.todo ? `<span class="todo">정보 확인 중</span>` : ""}
    ${actions}
  </article>`;
}

/* ── 화면: 주민 이야기 남기기 ─────────────────────────── */
let issue = {type:"", where:"", text:"", contact:"", agree:false};

function issueView(err){
  const t = ISSUE_TYPES.find(x=>x.id===issue.type);
  shell(`
    <button class="back" id="back">← 처음으로</button>
    <h2 class="head">우리 동네 이야기</h2>
    <p class="head-sub">주민이 알려주신 내용은 마을동행팀이 확인합니다</p>

    ${err ? `<p class="err">${esc(err)}</p>` : ""}

    <div class="field">
      <label>어떤 이야기인가요?</label>
      <div class="opts">
        ${ISSUE_TYPES.map(x=>`
          <label class="opt${issue.type===x.id?" sel":""}">
            <input type="radio" name="itype" value="${x.id}" ${issue.type===x.id?"checked":""}>
            <span>${esc(x.label)}<em>${esc(x.hint)}</em></span>
          </label>`).join("")}
      </div>
    </div>

    ${issue.type==="person" ? `
    <div class="urgent">
      <p><b>지금 쓰러져 계시거나 위급해 보이면</b> 글로 남기지 마시고
         ${esc(EMERGENCY.tel)}로 바로 신고해 주세요.</p>
      <a class="call" href="${telHref(EMERGENCY.tel)}">${esc(EMERGENCY.tel)} 신고하기</a>
      <p style="margin:14px 0 0">이 이야기함은 ${esc(HOURS.label)}에 확인합니다.
         ${isOpenNow()
           ? `지금은 업무 시간이니 전화가 더 빠릅니다.`
           : `지금은 업무 시간이 아니라 다음 근무일에 확인됩니다.`}</p>
      <a class="call" href="${telHref(isOpenNow()?FIRST_CALL.tel:AFTER_HOURS.tel)}" style="margin-top:12px">
        ${isOpenNow() ? esc(FIRST_CALL.name)+" "+esc(FIRST_CALL.tel)
                      : esc(AFTER_HOURS.name)+" "+esc(AFTER_HOURS.tel)+" (24시간)"}</a>
    </div>` : ""}

    <div class="field">
      <label>어디인가요?</label>
      <span class="hint">사는 곳이 아니라, 이야기하시려는 장소입니다</span>
      <div class="chips">
        ${TONGS.map(t=>`<button class="chip${issue.where===t?" sel":""}" data-tong="${esc(t)}">${esc(t)}</button>`).join("")}
      </div>
    </div>

    <div class="field">
      <label for="itext">어떤 일인지 알려주세요</label>
      <span class="hint">짧게 쓰셔도 괜찮습니다</span>
      <textarea id="itext" placeholder="예) 고운경로당 올라가는 계단에 손잡이가 없어서 비 오는 날 미끄럽습니다.">${esc(issue.text)}</textarea>
    </div>

    <div class="field">
      <label for="icontact">연락처 (안 쓰셔도 됩니다)</label>
      <span class="hint">더 여쭤볼 일이 있을 때만 연락드립니다</span>
      <input type="text" id="icontact" inputmode="tel" placeholder="010-0000-0000" value="${esc(issue.contact)}">
    </div>

    <div class="privacy">
      <b>알려드립니다</b>
      <ul>
        <li>남기신 내용은 길음종합사회복지관 마을동행팀이 동네 사업에 참고합니다.</li>
        <li>연락처는 확인 목적으로만 쓰고, 1년 뒤 지웁니다.</li>
        <li>연락처를 안 쓰셔도 이야기는 남길 수 있습니다.</li>
        <li>다른 사람의 이름이나 집 주소는 적지 말아 주세요.</li>
      </ul>
    </div>

    <label class="agree">
      <input type="checkbox" id="iagree" ${issue.agree?"checked":""}>
      <span>위 내용을 확인했고, 이야기를 남기는 데 동의합니다.</span>
    </label>

    <button class="call" id="isend">이야기 보내기</button>
  `);

  document.getElementById("back").onclick = home;

  app.querySelectorAll('input[name=itype]').forEach(el=>{
    el.onchange = ()=>{ syncFields(); issue.type = el.value; issueView(); };
  });
  app.querySelectorAll(".chip").forEach(el=>{
    el.onclick = ()=>{
      syncFields();
      issue.where = (issue.where === el.dataset.tong) ? "" : el.dataset.tong;
      issueView();
    };
  });
  document.getElementById("isend").onclick = sendIssue;
  window.scrollTo(0,0);
}

function syncFields(){
  const t = document.getElementById("itext");
  const c = document.getElementById("icontact");
  const a = document.getElementById("iagree");
  if (t) issue.text = t.value;
  if (c) issue.contact = c.value;
  if (a) issue.agree = a.checked;
}

async function sendIssue(){
  syncFields();
  if (!issue.type)            return issueView("어떤 이야기인지 골라 주세요.");
  if (!issue.text.trim())     return issueView("어떤 일인지 적어 주세요.");
  if (!issue.agree)           return issueView("맨 아래 동의에 표시해 주세요.");

  const t = ISSUE_TYPES.find(x=>x.id===issue.type);
  const body = new FormData();
  body.append(ISSUE_FORM.fields.type,    t ? t.label : issue.type);
  body.append(ISSUE_FORM.fields.where,   issue.where || "적지 않음");
  body.append(ISSUE_FORM.fields.text,    issue.text.trim());
  body.append(ISSUE_FORM.fields.contact, issue.contact.trim() || "적지 않음");

  const btn = document.getElementById("isend");
  if (btn) { btn.textContent = "보내는 중…"; btn.disabled = true; }

  try {
    await fetch(`https://docs.google.com/forms/d/e/${ISSUE_FORM.id}/formResponse`,
                {method:"POST", mode:"no-cors", body});
  } catch(e) {
    return issueView("보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.");
  }

  issue = {type:"", where:"", text:"", contact:"", agree:false};
  shell(`
    <div class="thanks">
      <h2>고맙습니다</h2>
      <p>남겨주신 이야기가 잘 전달되었습니다.</p>
      <p>마을동행팀이 확인하고 동네 사업에 반영하겠습니다.</p>
    </div>
    <button class="call" id="hb" style="margin-top:20px">처음으로</button>
  `);
  document.getElementById("hb").onclick = home;
  window.scrollTo(0,0);
}

function kindLegend(items){
  const used = Object.keys(KINDS).filter(k => items.some(r => (r.kind||"tel") === k));
  if (used.length < 2) return "";
  return `<ul class="kinds">${used.map(k=>
    `<li><span class="dot" style="background:${KINDS[k].color}"></span>${esc(KINDS[k].label)}</li>`
  ).join("")}</ul>`;
}

function list(catId){
  const all = catId ? RESOURCES.filter(r=>r.cat.includes(catId)) : RESOURCES.slice();
  all.forEach((r,i)=> r._i = i);
  const c = catId ? CATEGORIES.find(x=>x.id===catId) : {label:"동네 전체 지도", sub:"돈암1동에서 도움받을 수 있는 모든 곳"};
  const mapped = all.filter(hasPlace);

  shell(`
    <button class="back" id="back">← 처음으로</button>
    <h2 class="head">${esc(c.label)}</h2>
    <p class="head-sub">${esc(c.sub)}</p>
    ${kindLegend(all)}
    ${mapped.length ? `
      <div class="mapbox${catId?"":" tall"}" id="mapbox"><div id="map"></div></div>
      <p class="maphint">지도의 이름표를 누르면 아래에서 자세한 내용을 볼 수 있습니다.</p>` : ""}
    ${all.length ? all.map(card).join("") : `<div class="empty">아직 등록된 곳이 없습니다. 주민센터나 복지관으로 문의해 주세요.</div>`}
  `);

  document.getElementById("back").onclick = home;
  window.scrollTo(0,0);
  if (mapped.length) drawMap(mapped, !catId);
}

home();
</script>
</div>
</body>
</html>
